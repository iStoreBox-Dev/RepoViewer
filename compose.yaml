services:
  repoviewer:
    image: repoviewer:1.9.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repoviewer
    restart: unless-stopped
    ports:
      - "8088:3000"
    environment:
      PORT: "3000"
    networks:
      - default
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

networks:
  proxy:
    external: true
    name: proxy_net
